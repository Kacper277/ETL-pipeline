name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with flake8
        run: flake8 src/ tests/ scripts/ airflow/dags/

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://test_user:test_pass@localhost:5432/test_db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11 (with pip cache)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # DAG integrity tests need the Airflow dependency set. Installed
      # under the official constraints file for Airflow 2.11.2 so it
      # coexists with the app pins; no Airflow containers are started.
      - name: Install Airflow dependency set (for DAG integrity tests)
        run: pip install -r docker/requirements-airflow.txt --constraint https://raw.githubusercontent.com/apache/airflow/constraints-2.11.2/constraints-3.11.txt

      - name: Apply database schema
        run: psql postgresql://test_user:test_pass@localhost:5432/test_db -f sql/schema.sql
        env:
          PGPASSWORD: test_pass

      - name: Run tests with coverage
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ------------------------------------------------------------------
  # Streaming-path integration tests: the SAME docker-compose.yml used
  # locally is the single source of truth for CI configuration.
  # ------------------------------------------------------------------
  integration-tests:
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Compose interpolation + schema provisioning (test-only values).
      POSTGRES_USER: etl_user
      POSTGRES_PASSWORD: ci_test_password
      POSTGRES_DB: weather_db
      DATABASE_URL: postgresql+psycopg2://etl_user:ci_test_password@localhost:5432/weather_db
      # Airflow services are NOT started in CI, but Compose interpolates
      # the whole file, so their required variables must resolve.
      AIRFLOW_META_PASSWORD: ci_test_password
      # Integration tests run on the host -> host-visible broker address.
      KAFKA_BOOTSTRAP_SERVERS_HOST: localhost:9092
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11 (with pip cache)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start infrastructure (postgres + kafka + ui, bounded wait)
        run: docker compose up -d --wait postgres kafka kafka-ui
        timeout-minutes: 10

      - name: Apply database schemas (batch + streaming)
        run: |
          docker compose exec -T postgres psql -U etl_user -d weather_db -v ON_ERROR_STOP=1 < sql/schema.sql
          docker compose exec -T postgres psql -U etl_user -d weather_db -v ON_ERROR_STOP=1 < sql/schema_streaming.sql

      - name: Provision Kafka topics (idempotent)
        run: python scripts/create_topics.py

      - name: Run integration tests
        run: pytest -m integration -v

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker compose logs --tail=200 kafka kafka-ui postgres > compose_logs.txt
          cat compose_logs.txt

      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose_logs.txt

      - name: Tear down stack (always, including volumes)
        if: always()
        run: docker compose down -v --remove-orphans
