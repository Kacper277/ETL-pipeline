services:
  postgres:
    image: postgres:15-alpine
    container_name: etl_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-etl_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-weather_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - etl_network

  app:
    build: .
    container_name: etl_app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    env_file:
      - path: .env
        required: false
    volumes:
      - .:/app
    networks:
      - etl_network

  dashboard:
    build: .
    container_name: etl_dashboard
    depends_on:
      postgres:
        condition: service_healthy
    command: streamlit run src/dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-etl_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-weather_db}
    env_file:
      - path: .env
        required: false
    networks:
      - etl_network

  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Fixed cluster id (22-char base64 UUID) - stable across restarts.
      CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Single local broker -> replication factor 1 everywhere.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are provisioned explicitly by scripts/create_topics.py.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - etl_network

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka_ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - etl_network

  # ------------------------------------------------------------------
  # ORCHESTRATION LAYER (Apache Airflow 2.11.2, LocalExecutor)
  # Scheduled batch ETL only. The Kafka streaming path is a long-lived
  # process and is deliberately NOT managed by Airflow.
  #
  # All services live behind the "airflow" Compose profile so a plain
  # `docker compose up` does not boot the full Airflow stack; start it
  # explicitly with:
  #   docker compose --profile airflow up -d
  #   (or target a service directly: docker compose up -d airflow-webserver)
  # All services join the EXISTING etl_network so DAG tasks can reach
  # the weather database by the service name `postgres`.
  # ------------------------------------------------------------------
  postgres-airflow:
    # Dedicated metadata database - deliberately NOT the weather DB:
    # Airflow migrations and business data must never share a schema.
    image: postgres:15-alpine
    container_name: postgres_airflow
    environment:
      POSTGRES_USER: ${AIRFLOW_META_USER:-airflow_meta}
      POSTGRES_PASSWORD: ${AIRFLOW_META_PASSWORD:?Set AIRFLOW_META_PASSWORD in .env}
      POSTGRES_DB: ${AIRFLOW_META_DB:-airflow_meta}
    volumes:
      - airflow_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - etl_network
    profiles: [airflow]

  airflow-init:
    # One-shot bootstrap: schema migrations + admin user creation.
    # Credentials come from documented local defaults in .env.example.
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    container_name: airflow_init
    env_file:
      - path: .env
        required: false
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_META_USER:-airflow_meta}:${AIRFLOW_META_PASSWORD:?Set AIRFLOW_META_PASSWORD in .env}@postgres-airflow:5432/${AIRFLOW_META_DB:-airflow_meta}
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    depends_on:
      postgres-airflow:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "$${_AIRFLOW_WWW_USER_USERNAME}" \
          --password "$${_AIRFLOW_WWW_USER_PASSWORD}" \
          --firstname Admin --lastname User \
          --role Admin --email admin@example.local
    networks:
      - etl_network
    restart: "no"
    profiles: [airflow]

  airflow-webserver:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    container_name: airflow_webserver
    env_file:
      - path: .env
        required: false
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_META_USER:-airflow_meta}:${AIRFLOW_META_PASSWORD:?Set AIRFLOW_META_PASSWORD in .env}@postgres-airflow:5432/${AIRFLOW_META_DB:-airflow_meta}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      # Lets DAG files import the project modules (`from src.extract ...`).
      PYTHONPATH: /opt/airflow/project
      # Airflow-native connection to the WEATHER database (not the
      # metadata DB). Built from the same .env vars the app uses, so
      # credentials have exactly one source of truth.
      AIRFLOW_CONN_WEATHER_DB: postgres://${POSTGRES_USER:-etl_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-weather_db}
      # Writable location for task file handoff (raw JSON / processed CSV).
      AIRFLOW_ARTIFACTS_DIR: /opt/airflow/artifacts
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      postgres-airflow:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/project/src:ro
      - airflow_logs:/opt/airflow/logs
      - airflow_artifacts:/opt/airflow/artifacts
    networks:
      - etl_network
    restart: always
    profiles: [airflow]

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    container_name: airflow_scheduler
    env_file:
      - path: .env
        required: false
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_META_USER:-airflow_meta}:${AIRFLOW_META_PASSWORD:?Set AIRFLOW_META_PASSWORD in .env}@postgres-airflow:5432/${AIRFLOW_META_DB:-airflow_meta}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      PYTHONPATH: /opt/airflow/project
      AIRFLOW_CONN_WEATHER_DB: postgres://${POSTGRES_USER:-etl_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-weather_db}
      AIRFLOW_ARTIFACTS_DIR: /opt/airflow/artifacts
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      postgres-airflow:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/project/src:ro
      - airflow_logs:/opt/airflow/logs
      - airflow_artifacts:/opt/airflow/artifacts
    networks:
      - etl_network
    restart: always
    profiles: [airflow]

networks:
  etl_network:
    driver: bridge

volumes:
  postgres_data:
  kafka_data:
  airflow_db:
  airflow_logs:
  airflow_artifacts:
